kind = "solution"
spec = "ciphertext_multiplication/ckks@1.0.0"

# The library the envelope is built against, and the scheme it answers in.
# Two answers to one specification are comparable only when each says which.
[fhe]
library = "poulpy"
library_version = "0.8.2"
scheme = "ckks"

# Where your three functions are. The platform does not need to be told how to
# start the process: it generated the loop that starts it, and the command is a
# property of the language rather than something to declare.
[entry]
init = "solve::init"
run  = "solve::run"
free = "solve::free"

[build]
command = "cargo build --release --offline && install -m 0755 target/release/fherma-solution ./fherma-solution"

[runtime]
language = "rust"

# How it starts, given the directory of one point. Generated, and here so it
# can be read rather than guessed at.
run = "./fherma-solution"
