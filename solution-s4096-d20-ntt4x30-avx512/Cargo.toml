# GENERATED for ciphertext_multiplication/ckks@1.0.0 — and yours to keep: the harness never overwrites
# this file, so a crate your answer depends on stays named here.
[package]
name = "fherma-solution"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fherma-solution"
path = "src/main.rs"

# The backend is a build-time choice, so it is a feature here rather than a
# line in config.jsonc. None of them on means the architecture's default,
# which is what a fresh clone builds. One at a time; the envelope refuses two.
#
#   fft64-*     approximate f64 FFT, base2k up to 19
#   ntt4x30-*   exact NTT, four 30-bit primes, base2k up to 52
#   ntt3x42-*   exact NTT, three 42-bit primes, base2k up to 52
#   *-rayon     one operation spread over a rayon pool, sized by thread_count
#
# A wider limb is fewer limbs for the same torus width, and every operation
# walks the limbs: 550 bits is 29 limbs at base2k 19 and 11 at 52.
[features]
default = ["ntt4x30-avx512"]
rayon = ["dep:rayon"]
fft64-avx = ["poulpy-cpu-avx/enable-avx"]
fft64-avx-rayon = ["poulpy-cpu-avx/enable-rayon", "rayon"]
fft64-avx512 = ["dep:poulpy-cpu-avx512", "poulpy-cpu-avx512/enable-avx512f"]
fft64-avx512-rayon = ["dep:poulpy-cpu-avx512", "poulpy-cpu-avx512/enable-rayon", "rayon"]
ntt4x30-avx = ["poulpy-cpu-avx/enable-avx"]
ntt4x30-avx-rayon = ["poulpy-cpu-avx/enable-rayon", "rayon"]
ntt4x30-avx512 = ["dep:poulpy-cpu-avx512", "poulpy-cpu-avx512/enable-avx512f"]
ntt4x30-avx512-rayon = ["dep:poulpy-cpu-avx512", "poulpy-cpu-avx512/enable-rayon", "rayon"]
ntt3x42-ifma = ["dep:poulpy-cpu-avx512", "poulpy-cpu-avx512/enable-ifma"]
ntt3x42-ifma-rayon = ["dep:poulpy-cpu-avx512", "poulpy-cpu-avx512/enable-ifma", "poulpy-cpu-avx512/enable-rayon", "rayon"]
fft64-neon = ["poulpy-cpu-arm/enable-neon"]
fft64-neon-rayon = ["poulpy-cpu-arm/enable-rayon", "rayon"]
ntt4x30-neon = ["poulpy-cpu-arm/enable-neon"]
ntt4x30-neon-rayon = ["poulpy-cpu-arm/enable-rayon", "rayon"]

[dependencies]
poulpy-ckks = { git = "https://github.com/poulpy-fhe/poulpy", tag = "v0.9.0", features = ["test-utils"] }
poulpy-core = { git = "https://github.com/poulpy-fhe/poulpy", tag = "v0.9.0" }
poulpy-hal = { git = "https://github.com/poulpy-fhe/poulpy", tag = "v0.9.0" }
poulpy-cpu-portable = { git = "https://github.com/poulpy-fhe/poulpy", tag = "v0.9.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = { version = "1", optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
poulpy-cpu-avx = { git = "https://github.com/poulpy-fhe/poulpy", tag = "v0.9.0", features = ["enable-avx", "enable-ckks"] }
poulpy-cpu-avx512 = { git = "https://github.com/poulpy-fhe/poulpy", tag = "v0.9.0", features = ["enable-ckks"], optional = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
poulpy-cpu-arm = { git = "https://github.com/poulpy-fhe/poulpy", tag = "v0.9.0", features = ["enable-neon", "enable-ckks"] }

[profile.release]
opt-level = 3
